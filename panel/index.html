<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Panel — Álabes</title>
<link rel="icon" href="../img/logo-mark.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root {
    --bg-0: #171f10; --bg-1: #1d2615; --bg-2: #232e19; --bg-3: #2b381f;
    --olive-300: #c7d6ae; --olive-500: #a9c583; --olive-600: #8caf63;
    --brick: #c17650; --brick-soft: #d99a78;
    --amber-bg: rgba(196,154,45,0.18); --amber-text: #e0bb5c;
    --sold-bg: rgba(193,118,80,0.18); --sold-text: #d99a78;
    --ok-bg: rgba(169,197,131,0.16); --ok-text: #c7d6ae;
    --cream: #faf8f0; --cream-dim: #cfd2c1; --stone: #8f9583;
    --line: rgba(250,248,240,0.1); --line-strong: rgba(250,248,240,0.2);
    --radius: 8px; --radius-lg: 14px;
    --ff-display: "Poppins", sans-serif; --ff-body: "Inter", sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg-0); color: var(--cream); font-family: var(--ff-body); min-height: 100vh; }
  a { color: inherit; }
  ::selection { background: var(--olive-500); color: #10150c; }

  /* ---------- Login ---------- */
  #loginScreen { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .login-card { width: 100%; max-width: 380px; background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 40px 32px; text-align: center; }
  .login-card img { width: 64px; height: 64px; border-radius: 16px; margin-bottom: 18px; }
  .login-card h1 { font-family: var(--ff-display); font-weight: 700; font-size: 1.5rem; margin: 0 0 6px; }
  .login-card p.sub { color: var(--stone); font-size: 0.88rem; margin: 0 0 26px; }
  .field { text-align: left; margin-bottom: 16px; }
  .field label { display: block; font-size: 0.75rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase; color: var(--cream-dim); margin-bottom: 6px; }
  .field input, .field select, .field textarea {
    width: 100%; padding: 11px 13px; border-radius: var(--radius); border: 1px solid var(--line-strong);
    background: var(--bg-1); color: var(--cream); font-family: var(--ff-body); font-size: 0.95rem;
  }
  .field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--olive-500); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: none; border-radius: 100px;
    padding: 12px 22px; font-family: var(--ff-body); font-weight: 700; font-size: 0.9rem; cursor: pointer; transition: opacity .15s ease, background .15s ease; }
  .btn:hover { opacity: 0.88; }
  .btn--primary { background: var(--olive-500); color: #10150c; width: 100%; }
  .btn--ghost { background: transparent; color: var(--cream-dim); border: 1px solid var(--line-strong); }
  .btn--sm { padding: 7px 14px; font-size: 0.78rem; }
  .btn--danger { background: rgba(193,118,80,0.18); color: var(--brick-soft); }
  #loginError { color: var(--brick-soft); font-size: 0.85rem; margin-top: 14px; display: none; }

  /* ---------- Shell ---------- */
  #appShell { display: none; }
  header.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
    padding: 16px 28px; background: rgba(23,31,16,0.92); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .top__brand { display: flex; align-items: center; gap: 12px; }
  .top__brand img { width: 32px; height: 32px; border-radius: 8px; }
  .top__brand span { font-family: var(--ff-display); font-weight: 700; font-size: 1.1rem; }
  main { padding: 8px 28px 60px; max-width: 1100px; margin: 0 auto; }

  /* ---------- Toolbar ---------- */
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin: 22px 0 14px; }
  .toolbar input[type="search"] { flex: 1; min-width: 160px; }
  .chip-group { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: var(--bg-2); border: 1px solid var(--line-strong); color: var(--cream-dim); font-family: var(--ff-body);
    font-size: 0.8rem; font-weight: 700; padding: 7px 14px; border-radius: 100px; cursor: pointer; }
  .chip.is-active { background: var(--olive-500); color: #10150c; border-color: var(--olive-500); }
  .toolbar-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
  .spacer { flex: 1; }
  #unitCountLabel { color: var(--stone); font-size: 0.82rem; }

  /* ---------- Unit cards ---------- */
  #unitsList { display: flex; flex-direction: column; gap: 10px; }
  .unit-card-row { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 16px 18px; }
  .unit-card-row__head { display: flex; align-items: center; gap: 14px; cursor: pointer; flex-wrap: wrap; }
  .unit-card-row__code { font-family: var(--ff-display); font-weight: 700; font-size: 1.05rem; color: var(--olive-300); width: 96px; flex: none; }
  .unit-card-row__meta { color: var(--stone); font-size: 0.82rem; flex: 1; min-width: 120px; }
  .kind-badge { font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--stone);
    border: 1px solid var(--line-strong); border-radius: 100px; padding: 3px 9px; flex: none; }
  .status-pills { display: flex; gap: 6px; }
  .status-pill { border: 1px solid var(--line-strong); background: transparent; color: var(--stone); font-family: var(--ff-body);
    font-size: 0.72rem; font-weight: 700; padding: 6px 12px; border-radius: 100px; cursor: pointer; white-space: nowrap; }
  .status-pill[data-status="disponible"].is-active { background: var(--ok-bg); color: var(--ok-text); border-color: transparent; }
  .status-pill[data-status="reservado"].is-active { background: var(--amber-bg); color: var(--amber-text); border-color: transparent; }
  .status-pill[data-status="vendido"].is-active { background: var(--sold-bg); color: var(--sold-text); border-color: transparent; }
  .unit-card-row__toggle { color: var(--stone); flex: none; transition: transform .15s ease; }
  .unit-card-row.is-open .unit-card-row__toggle { transform: rotate(90deg); }
  .unit-card-row__body { display: none; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
  .unit-card-row.is-open .unit-card-row__body { display: grid; }
  .unit-card-row__body .field { margin-bottom: 0; }
  .unit-card-row__body .full { grid-column: 1 / -1; }
  .unit-card-row__actions { grid-column: 1 / -1; display: flex; gap: 10px; justify-content: flex-end; margin-top: 4px; flex-wrap: wrap; }
  .photo-row { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .photo-row img { width: 90px; height: 64px; object-fit: cover; border-radius: 6px; background: var(--bg-1); flex: none; }
  .photo-row .field { flex: 1; min-width: 200px; }

  /* ---------- Add unit form ---------- */
  #addUnitForm { background: var(--bg-2); border: 1px dashed var(--line-strong); border-radius: var(--radius-lg); padding: 18px; margin-bottom: 16px; display: none; }
  #addUnitForm.is-open { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
  #addUnitForm .full { grid-column: 1 / -1; display: flex; gap: 10px; justify-content: flex-end; }

  #toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--bg-3);
    border: 1px solid var(--line-strong); color: var(--cream); padding: 12px 20px; border-radius: 100px; font-size: 0.85rem;
    opacity: 0; transition: opacity .2s ease, transform .2s ease; pointer-events: none; z-index: 20; max-width: 90vw; text-align: center; }
  #toast.is-visible { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 640px) {
    header.top, main { padding-left: 16px; padding-right: 16px; }
    .unit-card-row__body, #addUnitForm.is-open { grid-template-columns: 1fr; }
    .status-pills { width: 100%; order: 3; }
  }
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-card">
    <img src="../img/admin-logo.png" alt="Álabes" />
    <h1>Panel de administración</h1>
    <p class="sub">Álabes</p>
    <form id="loginForm">
      <div class="field">
        <label for="loginEmail">Correo</label>
        <input type="email" id="loginEmail" autocomplete="username" required />
      </div>
      <div class="field">
        <label for="loginPassword">Contraseña</label>
        <input type="password" id="loginPassword" autocomplete="current-password" required />
      </div>
      <button type="submit" class="btn btn--primary" id="loginBtn">Iniciar sesión</button>
      <p id="loginError"></p>
    </form>
  </div>
</div>

<div id="appShell">
  <header class="top">
    <div class="top__brand">
      <img src="../img/admin-logo.png" alt="" />
      <span>Panel — Álabes</span>
    </div>
    <button class="btn btn--ghost btn--sm" id="logoutBtn">Cerrar sesión</button>
  </header>

  <main>
    <div class="toolbar-row">
      <span style="color:var(--stone); font-size:0.82rem; font-weight:700; text-transform:uppercase; letter-spacing:0.03em;">Grupo</span>
      <div class="chip-group" id="grupoFilters">
        <button class="chip is-active" data-filter="todos">Todos</button>
        <button class="chip" data-filter="a">Planta Baja (A)</button>
        <button class="chip" data-filter="b">1ra Planta Alta (B)</button>
        <button class="chip" data-filter="c">2da Planta Alta (C)</button>
        <button class="chip" data-filter="local">Locales comerciales</button>
      </div>
    </div>
    <div class="toolbar">
      <input type="search" id="unitSearch" placeholder="Buscar por código (ej. C10)" />
      <div class="chip-group" id="statusFilters">
        <button class="chip is-active" data-filter="todos">Todos</button>
        <button class="chip" data-filter="disponible">Disponibles</button>
        <button class="chip" data-filter="reservado">Reservados</button>
        <button class="chip" data-filter="vendido">Vendidos</button>
      </div>
      <div class="spacer"></div>
      <span id="unitCountLabel"></span>
      <button class="btn btn--primary btn--sm" id="showAddUnitBtn" style="width:auto;">+ Agregar unidad</button>
    </div>

    <form id="addUnitForm">
      <div class="field"><label>Código</label><input type="text" id="newCode" placeholder="Ej. B13" required /></div>
      <div class="field"><label>Tipo</label>
        <select id="newKind">
          <option value="suite">Suite / Depto</option>
          <option value="local">Local comercial</option>
        </select>
      </div>
      <div class="field"><label>Grupo (solo suites/deptos)</label>
        <select id="newGrupo">
          <option value="a">A — Planta Baja</option>
          <option value="b">B — 1ra Planta Alta</option>
          <option value="c">C — 2da Planta Alta</option>
        </select>
      </div>
      <div class="field"><label>Título</label><input type="text" id="newTitle" placeholder="Ej. Suite B13" required /></div>
      <div class="field"><label>Etiqueta (opcional)</label><input type="text" id="newTag" placeholder="Ej. Dúplex" /></div>
      <div class="field"><label>Estado</label>
        <select id="newStatus">
          <option value="disponible">Disponible</option>
          <option value="reservado">Reservado</option>
          <option value="vendido">Vendido</option>
        </select>
      </div>
      <div class="field"><label>Área (m² o "Consultar")</label><input type="text" id="newArea" placeholder="Ej. 45.20" /></div>
      <div class="field"><label>Dormitorios</label><input type="text" id="newDorm" placeholder="Ej. 1 dormitorio" /></div>
      <div class="field"><label>Baños</label><input type="text" id="newBanos" placeholder="Ej. 1 baño" /></div>
      <div class="field full"><label>Extra (patio/balcón/terraza)</label><input type="text" id="newExtra" placeholder="Ej. Balcón 3.29 m²" /></div>
      <div class="full">
        <button type="button" class="btn btn--ghost btn--sm" id="cancelAddUnit">Cancelar</button>
        <button type="submit" class="btn btn--primary btn--sm" style="width:auto;">Crear unidad</button>
      </div>
    </form>

    <div id="unitsList"></div>
  </main>
</div>

<div id="toast"></div>

<script>
var SUPABASE_URL = "https://hrecdyregmnbcmifjmva.supabase.co";
var SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhyZWNkeXJlZ21uYmNtaWZqbXZhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyNTcyMzQsImV4cCI6MjEwMjgzMzIzNH0.HQdhfanBdu3bc3MYF2S-fODHk3MK4J41K14Jvbe8nMo";
var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

var STATUS_LABEL = { disponible: "Disponible", reservado: "Reservado", vendido: "Vendido" };
var GRUPO_LABEL = { a: "Planta Baja (A)", b: "1ra Planta Alta (B)", c: "2da Planta Alta (C)" };
var allUnits = [];
var currentGrupoFilter = "todos";
var currentStatusFilter = "todos";
var currentSearch = "";

function toast(msg) {
  var el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("is-visible");
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { el.classList.remove("is-visible"); }, 2600);
}

function naturalCompare(a, b) {
  var na = a.match(/\d+/), nb = b.match(/\d+/);
  if (na && nb) return parseInt(na[0], 10) - parseInt(nb[0], 10);
  return a.localeCompare(b);
}

/* ================= AUTH ================= */
document.getElementById("loginForm").addEventListener("submit", function (e) {
  e.preventDefault();
  var email = document.getElementById("loginEmail").value.trim();
  var password = document.getElementById("loginPassword").value;
  var btn = document.getElementById("loginBtn");
  var errEl = document.getElementById("loginError");
  errEl.style.display = "none";
  btn.disabled = true;
  btn.textContent = "Entrando…";
  sb.auth.signInWithPassword({ email: email, password: password }).then(function (res) {
    btn.disabled = false;
    btn.textContent = "Iniciar sesión";
    if (res.error) {
      errEl.textContent = "No se pudo iniciar sesión: " + res.error.message;
      errEl.style.display = "block";
      return;
    }
    showApp();
  });
});

document.getElementById("logoutBtn").addEventListener("click", function () {
  sb.auth.signOut().then(function () { location.reload(); });
});

function showApp() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("appShell").style.display = "block";
  loadUnits();
}

sb.auth.getSession().then(function (res) {
  if (res.data && res.data.session) showApp();
});

/* ================= UNIDADES ================= */
function loadUnits() {
  sb.from("units").select("*").then(function (res) {
    if (res.error) { toast("Error al cargar unidades: " + res.error.message); return; }
    allUnits = res.data || [];
    allUnits.sort(function (a, b) {
      var ga = a.kind === "local" ? "zzz" : a.grupo, gb = b.kind === "local" ? "zzz" : b.grupo;
      if (ga !== gb) return ga.localeCompare(gb);
      return naturalCompare(a.code, b.code);
    });
    renderUnits();
  });
}

function matchesGrupoFilter(u) {
  if (currentGrupoFilter === "todos") return true;
  if (currentGrupoFilter === "local") return u.kind === "local";
  return u.kind === "suite" && u.grupo === currentGrupoFilter;
}

function renderUnits() {
  var list = document.getElementById("unitsList");
  var q = currentSearch.trim().toLowerCase();
  var filtered = allUnits.filter(function (u) {
    if (!matchesGrupoFilter(u)) return false;
    if (currentStatusFilter !== "todos" && u.status !== currentStatusFilter) return false;
    if (q && u.code.toLowerCase().indexOf(q) === -1 && u.title.toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  document.getElementById("unitCountLabel").textContent = filtered.length + " de " + allUnits.length + " unidades";
  list.innerHTML = "";
  filtered.forEach(function (u) {
    list.appendChild(buildUnitCard(u));
  });
}

function buildUnitCard(u) {
  var card = document.createElement("div");
  card.className = "unit-card-row";
  var metaBits = [];
  if (u.area) metaBits.push(u.area === "Consultar" ? "Área: Consultar" : u.area + " m²");
  if (u.dorm) metaBits.push(u.dorm);
  if (u.tag) metaBits.push(u.tag);
  var kindLabel = u.kind === "local" ? "Local comercial" : (GRUPO_LABEL[u.grupo] || "Suite/Depto");

  card.innerHTML =
    '<div class="unit-card-row__head">' +
      '<span class="unit-card-row__code">' + u.code + '</span>' +
      '<span class="kind-badge">' + kindLabel + '</span>' +
      '<span class="unit-card-row__meta">' + (metaBits.join(" · ") || u.title) + '</span>' +
      '<div class="status-pills">' +
        ["disponible", "reservado", "vendido"].map(function (s) {
          return '<button type="button" class="status-pill' + (u.status === s ? " is-active" : "") + '" data-status="' + s + '">' + STATUS_LABEL[s] + '</button>';
        }).join("") +
      '</div>' +
      '<span class="unit-card-row__toggle">▸</span>' +
    '</div>' +
    '<div class="unit-card-row__body">' +
      '<div class="field"><label>Título</label><input type="text" class="f-title" value="' + (u.title || "").replace(/"/g, "&quot;") + '" /></div>' +
      '<div class="field"><label>Etiqueta</label><input type="text" class="f-tag" value="' + (u.tag || "").replace(/"/g, "&quot;") + '" /></div>' +
      '<div class="field"><label>Área</label><input type="text" class="f-area" value="' + (u.area || "").replace(/"/g, "&quot;") + '" /></div>' +
      (u.kind === "suite" ?
        '<div class="field"><label>Dormitorios</label><input type="text" class="f-dorm" value="' + (u.dorm || "").replace(/"/g, "&quot;") + '" /></div>' +
        '<div class="field"><label>Baños</label><input type="text" class="f-banos" value="' + (u.banos || "").replace(/"/g, "&quot;") + '" /></div>' +
        '<div class="field full"><label>Extra (patio/balcón/terraza)</label><input type="text" class="f-extra" value="' + (u.extra || "").replace(/"/g, "&quot;") + '" /></div>'
        : '') +
      '<div class="photo-row">' +
        '<img class="f-photo-preview" src="' + resolveImgSrc(u.thumb) + '" alt="" />' +
        '<div class="field"><label>Foto de la tarjeta (subir para reemplazar)</label><input type="file" class="f-photo-file" accept="image/*" /></div>' +
      '</div>' +
      '<div class="unit-card-row__actions">' +
        '<button type="button" class="btn btn--danger btn--sm" data-action="delete">Eliminar unidad</button>' +
        '<button type="button" class="btn btn--primary btn--sm" data-action="save" style="width:auto;">Guardar cambios</button>' +
      '</div>' +
    '</div>';

  card.querySelector(".unit-card-row__head").addEventListener("click", function (e) {
    if (e.target.closest(".status-pill")) return;
    card.classList.toggle("is-open");
  });

  card.querySelectorAll(".status-pill").forEach(function (pill) {
    pill.addEventListener("click", function () {
      var newStatus = pill.getAttribute("data-status");
      if (newStatus === u.status) return;
      sb.from("units").update({ status: newStatus }).eq("code", u.code).then(function (res) {
        if (res.error) { toast("Error: " + res.error.message); return; }
        u.status = newStatus;
        card.querySelectorAll(".status-pill").forEach(function (p) {
          p.classList.toggle("is-active", p.getAttribute("data-status") === newStatus);
        });
        toast(u.code + " → " + STATUS_LABEL[newStatus]);
        if (currentStatusFilter !== "todos" && currentStatusFilter !== newStatus) renderUnits();
      });
    });
  });

  card.querySelector('[data-action="save"]').addEventListener("click", function () {
    var payload = {
      title: card.querySelector(".f-title").value.trim(),
      tag: card.querySelector(".f-tag").value.trim() || null,
      area: card.querySelector(".f-area").value.trim() || null
    };
    if (u.kind === "suite") {
      payload.dorm = card.querySelector(".f-dorm").value.trim() || null;
      payload.banos = card.querySelector(".f-banos").value.trim() || null;
      payload.extra = card.querySelector(".f-extra").value.trim() || null;
    }
    var fileInput = card.querySelector(".f-photo-file");
    var file = fileInput.files[0];

    function applyUpdate(extra) {
      var full = Object.assign({}, payload, extra || {});
      sb.from("units").update(full).eq("code", u.code).then(function (res) {
        if (res.error) { toast("Error: " + res.error.message); return; }
        Object.assign(u, full);
        toast(u.code + " guardado");
        renderUnits();
      });
    }

    if (file) {
      var path = "alabes/" + u.code + "-" + Date.now() + "-" + file.name.replace(/[^a-zA-Z0-9.\-_]/g, "_");
      sb.storage.from("site-images").upload(path, file).then(function (res) {
        if (res.error) { toast("Error al subir foto: " + res.error.message); return; }
        var pub = sb.storage.from("site-images").getPublicUrl(path);
        applyUpdate({ thumb: pub.data.publicUrl });
      });
    } else {
      applyUpdate();
    }
  });

  card.querySelector('[data-action="delete"]').addEventListener("click", function () {
    if (!confirm("¿Eliminar la unidad " + u.code + "? Esta acción no se puede deshacer.")) return;
    sb.from("units").delete().eq("code", u.code).then(function (res) {
      if (res.error) { toast("Error: " + res.error.message); return; }
      allUnits = allUnits.filter(function (x) { return x.code !== u.code; });
      toast(u.code + " eliminado");
      renderUnits();
    });
  });

  return card;
}

function resolveImgSrc(src) {
  if (!src) return "";
  if (/^https?:\/\//.test(src)) return src;
  return "../" + src;
}

document.getElementById("unitSearch").addEventListener("input", function (e) {
  currentSearch = e.target.value;
  renderUnits();
});

document.querySelectorAll("#statusFilters .chip").forEach(function (chip) {
  chip.addEventListener("click", function () {
    document.querySelectorAll("#statusFilters .chip").forEach(function (c) { c.classList.remove("is-active"); });
    chip.classList.add("is-active");
    currentStatusFilter = chip.getAttribute("data-filter");
    renderUnits();
  });
});

document.querySelectorAll("#grupoFilters .chip").forEach(function (chip) {
  chip.addEventListener("click", function () {
    document.querySelectorAll("#grupoFilters .chip").forEach(function (c) { c.classList.remove("is-active"); });
    chip.classList.add("is-active");
    currentGrupoFilter = chip.getAttribute("data-filter");
    renderUnits();
  });
});

document.getElementById("showAddUnitBtn").addEventListener("click", function () {
  document.getElementById("addUnitForm").classList.add("is-open");
});
document.getElementById("cancelAddUnit").addEventListener("click", function () {
  document.getElementById("addUnitForm").classList.remove("is-open");
});

document.getElementById("newKind").addEventListener("change", function (e) {
  var isLocal = e.target.value === "local";
  document.getElementById("newGrupo").closest(".field").style.display = isLocal ? "none" : "block";
});

document.getElementById("addUnitForm").addEventListener("submit", function (e) {
  e.preventDefault();
  var code = document.getElementById("newCode").value.trim();
  if (!code) return;
  if (allUnits.some(function (u) { return u.code.toLowerCase() === code.toLowerCase(); })) {
    toast("Ya existe una unidad con ese código");
    return;
  }
  var kind = document.getElementById("newKind").value;
  var maxSort = allUnits.filter(function (u) {
    return kind === "local" ? u.kind === "local" : (u.kind === "suite" && u.grupo === document.getElementById("newGrupo").value);
  }).reduce(function (max, u) { return Math.max(max, u.sort_order || 0); }, -1);

  var payload = {
    code: code,
    kind: kind,
    grupo: kind === "local" ? null : document.getElementById("newGrupo").value,
    title: document.getElementById("newTitle").value.trim(),
    tag: document.getElementById("newTag").value.trim() || null,
    status: document.getElementById("newStatus").value,
    area: document.getElementById("newArea").value.trim() || null,
    dorm: kind === "local" ? null : (document.getElementById("newDorm").value.trim() || null),
    banos: kind === "local" ? null : (document.getElementById("newBanos").value.trim() || null),
    extra: kind === "local" ? null : (document.getElementById("newExtra").value.trim() || null),
    ficha: null,
    thumb: null,
    sort_order: maxSort + 1
  };
  sb.from("units").insert(payload).then(function (res) {
    if (res.error) { toast("Error: " + res.error.message); return; }
    toast("Unidad " + code + " creada. Puedes subirle una foto abriendo su tarjeta y editando los detalles.");
    document.getElementById("addUnitForm").reset();
    document.getElementById("addUnitForm").classList.remove("is-open");
    loadUnits();
  });
});
</script>
</body>
</html>
